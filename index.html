<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickBite Food Delivery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            text-align: center;
        }
        header {
            background: #ff7043;
            color: white;
            padding: 25px;
        }
        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 30px;
        }
        .item {
            background: white;
            padding: 20px;
            width: 180px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }
    </style>
</head>
<body>
    <header>
        <h1>QuickBite</h1>
        <p>Your favourite food, delivered fresh!</p>
    </header>

    <h2>Our Menu</h2>

    <div class="menu">
        <div class="item">
            <h3>Pizza</h3>
            <p>Price: ₹199</p>
        </div>
        <div class="item">
            <h3>Burger</h3>
            <p>Price: ₹99</p>
        </div>
        <div class="item">
            <h3>Biryani</h3>
            <p>Price: ₹149</p>
        </div>
    </div>
</body>
</html>
